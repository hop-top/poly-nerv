services:
  claude:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      args:
        CLI_NAME: claude
        CLI_VERSION: "${CLAUDE_VERSION:-latest}"
  gemini:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      args:
        CLI_NAME: gemini
        CLI_VERSION: "${GEMINI_VERSION:-latest}"
  codex:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      args:
        CLI_NAME: codex
        CLI_VERSION: "${CODEX_VERSION:-latest}"
  opencode:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      args:
        CLI_NAME: opencode
        CLI_VERSION: "${OPENCODE_VERSION:-1.19.3}"
  opencode-v2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      args:
        CLI_NAME: opencode
        CLI_KEY: opencode-v2
        CLI_VERSION: "${OPENCODE_V2_VERSION:-2.2.5}"
  goose:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      args:
        CLI_NAME: goose
        CLI_VERSION: "${GOOSE_VERSION:-1.55.0}"
  openhands:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test
      args:
        CLI_NAME: openhands
        CLI_VERSION: "${OPENHANDS_VERSION:-1.16.0}"
