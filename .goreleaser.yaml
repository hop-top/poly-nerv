version: 2
builds:
  - id: nerv
    main: ./cmd/nerv
    binary: nerv
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: nervd
    main: ./cmd/nervd
    binary: nervd
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^chore:']
