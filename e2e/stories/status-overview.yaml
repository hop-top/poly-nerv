# yaml-language-server: $schema=https://raw.githubusercontent.com/hop-top/kit/main/contracts/story-schema.json
schema_version: "1"
story_id: nerv.status.installation-overview
title: Review nerv installation state at a glance
binary: nerv
intent: |
  A solo developer verifying a nerv setup wants a single view of the
  daemon state, the detected AI CLI adapters, and how many hooks and
  events are currently active. They run nerv status and capture stdout
  so the snapshot can be pasted into a setup note.
preconditions:
  - nerv binary is on PATH
steps:
  - id: overview
    intent: |
      Print the combined daemon and adapter status table. The developer
      reads the daemon row to confirm whether nervd is running and scans
      the adapters row for the CLIs nerv has detected.
    invoke: ["nerv", "status"]
    capture: [exit_code, stdout]
