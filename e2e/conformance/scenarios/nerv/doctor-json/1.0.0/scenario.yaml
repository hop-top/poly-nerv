schema_version: "1"
scenario_id: doctor-json
description: >-
  Health check in JSON mode: one structured record per component with
  a branchable status field, clean exit.
binary: nerv
factor_coverage: [3, 8, 11]
tier: 3
story_ref:
  story_id: nerv.conformance.doctor-json
  story_path: stories/doctor-json.yaml
  content_hash: "sha256:b4f0e2854b336fa103c955fb51936194f6839e4002949ceb55a98cf17d764f8c"
steps:
  - id: doctor_json
    invoke: ["nerv", "doctor", "--format", "json"]
    capture: [exit_code, stdout, stderr]
assertions:
  - id: stdout-is-json
    kind: stream_discipline_pass
    on: doctor_json
    factor: 3
  - id: doctor-schema
    kind: output_schema_matches
    on: doctor_json
    factor: 3
    schema:
      type: array
      items:
        type: object
        required: [name, status]
        properties:
          name: { type: string }
          status: { type: string }
          message: { type: string }
  - id: component-status-inspectable
    kind: output_field_present
    on: doctor_json
    factor: 8
    path: "0.status"
  - id: exits-zero
    kind: exit_code_equals
    on: doctor_json
    factor: 11
    value: 0
