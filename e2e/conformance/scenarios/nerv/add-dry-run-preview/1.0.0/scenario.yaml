schema_version: "1"
scenario_id: add-dry-run-preview
description: >-
  Dry-run of a hook install: preview must be structured in JSON mode
  and must not mutate project state; the follow-up status read must
  still report zero hooks.
binary: nerv
factor_coverage: [3, 6, 11]
tier: 3
story_ref:
  story_id: nerv.conformance.add-dry-run-preview
  story_path: stories/add-dry-run-preview.yaml
  content_hash: "sha256:193cdd8a243da0e08474ad9e6c5971ddb63df9752a8ee1a66d4b72c117e05ed6"
steps:
  - id: add_dry
    invoke: ["nerv", "add", "demo-hook", "--source", "./handler.sh", "--dry-run", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: status_after_dry
    invoke: ["nerv", "status", "--format", "json"]
    capture: [exit_code, stdout]
assertions:
  - id: preview-is-structured
    kind: stream_discipline_pass
    on: add_dry
    factor: 3
  - id: no-mutation-under-dry-run
    kind: output_field_equals
    on: status_after_dry
    factor: 6
    path: '#(key=="hooks").value'
    value: "0 defined (version: )"
  - id: dry-run-exits-zero
    kind: exit_code_equals
    on: add_dry
    factor: 11
    value: 0
