schema_version: "1"
scenario_id: status-json
description: >-
  Status report in JSON mode: structured stdout, inspectable daemon /
  hook / event-log state, clean exit.
binary: nerv
factor_coverage: [3, 8, 11]
tier: 3
story_ref:
  story_id: nerv.conformance.status-json
  story_path: stories/status-json.yaml
  content_hash: "sha256:368e838220e4f9256366c4af5b99939928b2bfa65c290686937e33677cdd133d"
steps:
  - id: status_json
    invoke: ["nerv", "status", "--format", "json"]
    capture: [exit_code, stdout, stderr]
assertions:
  - id: stdout-is-json
    kind: stream_discipline_pass
    on: status_json
    factor: 3
  - id: status-schema
    kind: output_schema_matches
    on: status_json
    factor: 3
    schema:
      type: array
      items:
        type: object
        required: [key, value]
        properties:
          key: { type: string }
          value: { type: string }
  - id: daemon-state-inspectable
    kind: output_field_present
    on: status_json
    factor: 8
    path: '#(key=="daemon").value'
  - id: hook-state-inspectable
    kind: output_field_present
    on: status_json
    factor: 8
    path: '#(key=="hooks").value'
  - id: eventlog-state-inspectable
    kind: output_field_present
    on: status_json
    factor: 8
    path: '#(key=="event log").value'
  - id: exits-zero
    kind: exit_code_equals
    on: status_json
    factor: 11
    value: 0
