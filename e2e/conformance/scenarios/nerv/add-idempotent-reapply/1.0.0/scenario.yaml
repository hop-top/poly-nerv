schema_version: "1"
scenario_id: add-idempotent-reapply
description: >-
  Duplicate add converges: reissued install exits clean, registers the
  hook exactly once, and removing an absent hook also exits clean.
binary: nerv
factor_coverage: [7]
tier: 3
story_ref:
  story_id: nerv.conformance.add-idempotent-reapply
  story_path: stories/add-idempotent-reapply.yaml
  content_hash: "sha256:9ef507a177cfb9e55098db504c7d5684d32c8116d09985dc305ed77595e1903f"
steps:
  - id: add_first
    invoke: ["nerv", "add", "demo-hook", "--source", "./handler.sh", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: add_again
    invoke: ["nerv", "add", "demo-hook", "--source", "./handler.sh", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: status_converged
    invoke: ["nerv", "status", "--format", "json"]
    capture: [exit_code, stdout]
  - id: remove_absent
    invoke: ["nerv", "remove", "ghost-hook", "--confirm", "yes", "--format", "json"]
    capture: [exit_code, stdout, stderr]
assertions:
  - id: first-apply-clean
    kind: exit_code_equals
    on: add_first
    factor: 7
    value: 0
  - id: reapply-clean
    kind: exit_code_equals
    on: add_again
    factor: 7
    value: 0
  - id: converged-single-registration
    kind: output_field_equals
    on: status_converged
    factor: 7
    path: '#(key=="hooks").value'
    value: "1 defined (version: 1)"
  - id: absent-target-remove-clean
    kind: exit_code_equals
    on: remove_absent
    factor: 7
    value: 0
