schema_version: "1"
scenario_id: error-envelope-correction
description: >-
  Flawed invocations must yield structured, corrective errors and
  class-accurate exit codes: not-found for a missing event, usage for
  an unknown flag and an unknown command.
binary: nerv
factor_coverage: [4, 11]
tier: 3
story_ref:
  story_id: nerv.conformance.error-envelope-correction
  story_path: stories/error-envelope-correction.yaml
  content_hash: "sha256:277eb5f863a38a94fc501f9c1259a1fccd206c560c08b019696ba00303cfdfa4"
steps:
  - id: replay_missing
    invoke: ["nerv", "replay", "evt-does-not-exist", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: unknown_flag
    invoke: ["nerv", "status", "--bogus-flag", "--format", "json"]
    capture: [exit_code, stdout, stderr]
  - id: unknown_command
    invoke: ["nerv", "frobnicate"]
    capture: [exit_code, stdout, stderr]
assertions:
  - id: envelope-has-code
    kind: stderr_contains
    on: replay_missing
    factor: 4
    value: '"code"'
  # Factor 4 makes corrective guidance normative but prescribes no
  # canonical key (the spec's corrections/suggestion keys appear in a
  # non-normative example); the kit error envelope spells them
  # suggested_fix/alternatives, so the detector accepts both families.
  - id: envelope-offers-correction
    kind: stderr_contains
    on: replay_missing
    factor: 4
    value: "(suggestion|suggested_fix|corrections|alternatives|hint|did you mean)"
    regex: true
  - id: missing-event-is-not-found-class
    kind: exit_code_class
    on: replay_missing
    factor: 11
    classes: [NOT_FOUND]
  - id: unknown-flag-correction-hint
    kind: stderr_contains
    on: unknown_flag
    factor: 4
    value: "Try --help"
  - id: unknown-flag-is-usage-class
    kind: exit_code_class
    on: unknown_flag
    factor: 11
    classes: [USAGE]
  - id: unknown-command-is-usage-class
    kind: exit_code_class
    on: unknown_command
    factor: 11
    classes: [USAGE]
