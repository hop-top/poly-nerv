name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  # ── Go (daemon root module) ───────────────────────────────────
  #
  # The Go test phase includes ./test/parity/... which exercises every
  # SDK (Go in-process, plus TS/Py/Rust/PHP shell-outs). To prevent
  # those parity tests from skipping on the official runner, install
  # the matching toolchains before `go test`. Per-SDK jobs below still
  # run as the source of truth for build/lint/test of each SDK; the
  # parity job here is wire-compatibility smoke only.
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Node + TS dist + node_modules for TestParity_TypeScript.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.0
      - name: Build TS SDK for parity harness
        working-directory: sdk/ts
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build
      # Python venv for TestParity_Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.10'
      - name: Provision Python venv for parity harness
        working-directory: sdk/py
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .
      # Rust toolchain + cargo cache for TestParity_Rust.
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sdk/rs
      # PHP + composer + ext-grpc for TestParity_PHP. Real wire
      # transport over PECL grpc; parity_client.php exits 3 (skip)
      # only when the extension is absent — installed here so the
      # test runs unskipped on every push.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          tools: composer:v2
          extensions: grpc
      - name: Install PHP SDK vendor for parity harness
        working-directory: sdk/php
        run: composer install --no-interaction --prefer-dist
      - run: go build -buildvcs=false ./...
      - run: go test -cover -coverprofile=coverage.out ./...
      # Generated protobuf/Connect code (gen/go), the marketplace template
      # handler and the nerv-codegen tool are excluded from the figure.
      - name: Coverage gate (>=60%)
        run: |
          grep -v -E '^hop\.top/nerv/(gen/go/|marketplace/template/|cmd/nerv-codegen/)' coverage.out > coverage.gate.out
          TOTAL=$(go tool cover -func=coverage.gate.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${TOTAL}%"
          if awk "BEGIN{exit(!($TOTAL < 60))}"; then
            echo "::error::Coverage ${TOTAL}% below 60% threshold"
            exit 1
          fi
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  # ── Go SDK (hop.top/nerv/sdk/go submodule) ────────────────────
  # Runs with GOWORK=off so the SDK's own go.mod is the source of
  # truth — catches dep declaration drift the workspace would mask.
  go-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/go/go.mod
      - run: go build -buildvcs=false ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: sdk/go

  # ── TypeScript ────────────────────────────────────────────────
  ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - run: pnpm test

  # ── Python ────────────────────────────────────────────────────
  # Matrix: the requires-python floor (3.11) + the mise.toml pin.
  py:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/py
    strategy:
      matrix:
        python-version: ['3.11', '3.14.10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install + test + lint
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pytest
          .venv/bin/ruff check .

  # ── Rust ──────────────────────────────────────────────────────
  # rust-toolchain.toml in sdk/rs pins the exact release (mise.toml
  # `rust`; edition 2024 needs >=1.85) + components (rustfmt, clippy)
  # for local dev and CI. The action installs the same release; cargo
  # honours the file inside sdk/rs.
  rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@ff7f6a3374ce205788da40198ec918bd5d67aea7 # 1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: sdk/rs
      # build.rs compiles contracts/proto with tonic-prost-build, which
      # shells out to protoc. Official release zip, checksum-verified;
      # version matches mise.toml `protoc` and publish.yml nerv-rs protoc-version. Not tracked by Dependabot:
      # bump both by hand (14-day age gate).
      - name: Install protoc
        working-directory: .
        env:
          PROTOC_VERSION: '36.2'
          PROTOC_SHA256: 121f6c7afe1d4d0e3ea6aab9432038599250134cbf4474cb1167d2c7decd4278
        run: |
          zip="$RUNNER_TEMP/protoc.zip"
          curl -fsSL -o "$zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  ${zip}" | sha256sum -c -
          unzip -q "$zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/protoc/bin/protoc" --version
      - run: cargo build
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check

  # ── PHP ───────────────────────────────────────────────────────
  php:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/php
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          # PECL grpc — required by GrpcTransport for wire integration
          # tests in WireTest.php. SDK still loads + stub tests still
          # run without it (ext-grpc is a composer soft dep).
          extensions: grpc
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  # ── Proto lint + format ───────────────────────────────────────
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@85aebf73123b5c15fd5528aaecbf9129cddf7fa7 # v1.6.0
        with:
          setup_only: true
      - run: buf lint
      - run: buf format -d --exit-code
