version: 2
# Every entry below sets:
#   cooldown         a new release is proposed only once it is 14 days old
#                    (the dependency age gate). It holds back version
#                    updates only: Dependabot security updates ignore it and
#                    open as soon as an advisory lands. Owned packages are
#                    excluded, as they are from the age gate.
#   rebase-strategy  disabled: an open PR is not rebased, and its CI not
#                    re-run, each time main moves. Comment `@dependabot
#                    rebase` on a PR to refresh it. This applies to security
#                    PRs as well.
#   groups           one PR per run for minor + patch; majors stay separate
#                    for review.
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop.top/*", "github.com/hop-top/*"]
    rebase-strategy: disabled
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The SDK module requires hop.top/nerv; release-please moves that
  # require (excluded from the cooldown like every owned package).
  - package-ecosystem: gomod
    directory: "/sdk/go"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop.top/*", "github.com/hop-top/*"]
    rebase-strategy: disabled
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/sdk/ts"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["@hop-top/*"]
    rebase-strategy: disabled
    ignore:
      # Typings move with the Node pin (mise.toml, CI node-version), by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pyproject.toml without a lockfile.
  - package-ecosystem: pip
    directory: "/sdk/py"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top-*"]
    rebase-strategy: disabled
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: "/sdk/rs"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top-*"]
    rebase-strategy: disabled
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: composer
    directory: "/sdk/php"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "build(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top/*"]
    rebase-strategy: disabled
    ignore:
      # PHPUnit 12 requires PHP 8.3; composer.json keeps the PHP 8.2 floor.
      - dependency-name: phpunit/phpunit
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Workflow `uses:` refs: every one is pinned to a commit SHA with its
  # version in a trailing comment; Dependabot moves the SHA and the
  # comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: "ci(deps):"
    # Version updates only; security updates are exempt.
    cooldown:
      default-days: 14
      exclude: ["hop-top/*"]
    rebase-strategy: disabled
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
