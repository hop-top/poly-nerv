# OpenCode adapter capability map for nerv.
# Source: docs/research/opencode.md + docs/research/mappings.md
cli: opencode
# Two plugin API generations, one nervd wire shape; the installer picks the
# bridge from `opencode --version`.
#   v1 (1.x): default-exported plugin function; bus events via the "event"
#     hook. Verified against sst/opencode v1.19.3.
#   v2 (2.x): Plugin.define({id, setup(ctx)}); tool hooks via
#     ctx.tool.hook, system prompt via ctx.session.hook("context"), bus
#     events via ctx.event.subscribe. Verified against anomalyco/opencode
#     v2.2.5 (also run against 2.2.1).
# Sources below name the v1 events (the wire names nervd translates); the v2
# bridge derives the ones v2 has no bus event for: file.edited from
# edit/write/patch completions, todo.updated from todowrite completions,
# session.idle from session.execution.succeeded/interrupted, session.error
# from session.execution.failed, session.compacted from
# session.compaction.ended.
cli_version_range: ">=1.19.3 <2.0.0 || >=2.2.0 <3.0.0"

native:
  - source: session.created
    target: SessionStart
  - source: session.deleted
    target: SessionEnd
  - source: session.idle
    target: Stop
  - source: session.error
    target: StopFailure
  - source: session.compacted
    target: PostCompact
  - source: tool.execute.before
    target: PreToolUse
    blocking: true
  - source: tool.execute.after
    target: PostToolUse
  - source: file.edited
    target: FileChanged
  - source: permission.asked
    target: PermissionRequest
  - source: permission.replied
    target: PermissionDenied
    # bridge sends decision "deny" for reply "reject" (once/always are skipped)
    filter: "replied.decision == 'deny'"

close:
  - source: tui.prompt.append
    target: UserPromptSubmit

synthesized:
  - target: UserPromptSubmit
    via: tui.prompt.append
  - target: Notification
    via: session.error
    filter: partial
  - target: SubagentStart
    via: tool.execute.before
    match: "tool == 'task'"
  - target: SubagentStop
    via: tool.execute.after
    match: "tool == 'task'"
  - target: InstructionsLoaded
    via: tool.execute.after
    match: "tool == 'read' && path matches CLAUDE\\.md"
  - target: ConfigChange
    via: file.edited
    match: "path matches config"
  - target: CwdChanged
    via: tool.execute.after
    match: "tool == 'bash' && input matches '^cd\\b'"
  - target: WorktreeCreate
    via: tool.execute.after
    match: "tool == 'bash' && input matches 'worktree add'"
  - target: WorktreeRemove
    via: tool.execute.after
    match: "tool == 'bash' && input matches 'worktree remove'"
  - target: TaskCreated
    via: tool.execute.before
    match: "tool == 'todo_write'"
  - target: TaskCompleted
    via: todo.updated
    filter: "status == 'completed'"
  - target: Elicitation
    via: tool.execute.before
    match: "tool matches '^mcp__'"
  - target: ElicitationResult
    via: tool.execute.after
    match: "tool matches '^mcp__'"

unsupported:
  - TeammateIdle
  - PreCompact
