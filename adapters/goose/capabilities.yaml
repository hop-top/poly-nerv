# Goose CLI capability map for nerv adapter.
# Source: aaif-goose/goose v1.55.0
#   documentation/docs/guides/context-engineering/hooks.md
#   crates/goose/src/hooks/mod.rs (plugin hooks, hooks/hooks.json)
# Every native entry is a plugin hook the installer writes to hooks.json
# and `nervd --adapter goose` decodes (adapters/goose/translate.go
# hookToNerv). Goose delivers nothing else to nerv: no SSE or MCP bridge is
# installed, and no hook payload is turned into a synthesized event, so
# there are no synthesized or close entries.
#
# Goose hook events not mapped (hooks.md "Supported Events"):
#   PreToolUseResult      observation of the PreToolUse chain outcome
#   BeforeReadFile        no nerv event
#   BeforeShellExecution  duplicates PreToolUse(shell)
#   AfterShellExecution   duplicates PostToolUse(shell)
cli: goose
cli_version_range: ">=1.55.0"

native:
  - goose: SessionStart
    nerv: SessionStart
    note: plugin hook; block ignored, banner stdout is user-visible only
  - goose: SessionEnd
    nerv: SessionEnd
    note: plugin hook
  - goose: Stop
    nerv: Stop
    note: plugin hook; block keeps the turn going (reason shown to model)
  - goose: UserPromptSubmit
    nerv: UserPromptSubmit
    note: plugin hook; block ignored
  - goose: PreToolUse
    nerv: PreToolUse
    note: plugin hook; block denies the call (reason shown to model)
  - goose: PostToolUse
    nerv: PostToolUse
    note: plugin hook; observation only
  - goose: PostToolUseFailure
    nerv: PostToolUseFailure
    note: plugin hook; observation only
  - goose: AfterFileEdit
    nerv: FileChanged
    note: plugin hook; matcher_context is the edited path

unsupported:
  - StopFailure
  - PermissionRequest
  - PermissionDenied
  - Notification
  - SubagentStart
  - SubagentStop
  - TeammateIdle
  - TaskCreated
  - TaskCompleted
  - InstructionsLoaded
  - ConfigChange
  - CwdChanged
  - PreCompact
  - PostCompact
  - WorktreeCreate
  - WorktreeRemove
  - Elicitation
  - ElicitationResult
