# Codex CLI adapter capabilities for nerv.
#
# 3 native events (full parity), 12 synthesized via shell regex / daemon /
# binary wrapper, 11 unsupported (no feasible workaround).
#
# Schema: spec/capabilities.schema.json
# Source: docs/research/codex-cli.md

cli: codex-cli
cli_version_range: ">=0.1.0"

native:
  - SessionStart
  - UserPromptSubmit
  - Stop

synthesized:
  PreToolUse:
    technique: matcher
    via: shell
    pattern: "*"
    cost: low
    notes: "Bash-only; apply_patch incomplete"
  PostToolUse:
    technique: matcher
    via: shell
    pattern: "*"
    cost: low
    notes: "Bash-only; apply_patch incomplete"
  CwdChanged:
    technique: matcher
    via: shell
    pattern: "^cd\\s"
    cost: low
  WorktreeCreate:
    technique: matcher
    via: shell
    pattern: "git\\s+worktree\\s+add"
    cost: low
  WorktreeRemove:
    technique: matcher
    via: shell
    pattern: "git\\s+worktree\\s+remove"
    cost: low
  InstructionsLoaded:
    technique: matcher
    via: shell
    pattern: "cat\\s+.*CLAUDE\\.md"
    cost: low
  PermissionRequest:
    technique: matcher
    via: shell
    pattern: "rm\\s+-rf"
    cost: medium
    notes: "Heuristic: rm -rf commands trigger permission request via shellmatch"
  PermissionDenied:
    technique: matcher
    via: shell
    pattern: "shell block response"
    cost: medium
    notes: "Derived from shell command block response"
  PostToolUseFailure:
    technique: status_diff
    via: shell
    pattern: "PostToolUse + non-zero exit"
    cost: low
  FileChanged:
    technique: daemon
    via: fswatch
    cost: high
    notes: "Requires fswatch/inotifywait; daemon mode only"
  ConfigChange:
    technique: daemon
    via: fswatch
    cost: high
    notes: "Watches ~/.codex/config.toml and .codex/hooks.json"
  Notification:
    technique: binary_wrap
    cost: high
    notes: "Requires binary wrapper parsing stdout for [notify] lines"

unsupported:
  - TeammateIdle
  - SubagentStart
  - SubagentStop
  - TaskCreated
  - TaskCompleted
  - PreCompact
  - PostCompact
  - Elicitation
  - ElicitationResult
  - StopFailure
  - SessionEnd
