# Aider CLI capability map for nerv adapter.
# Aider has no native hook system. The only extension points are the
# lint-cmd and test-cmd shell commands, which Aider runs AFTER it has
# applied an edit (aider/coders/base_coder.py: lint_edited, cmd_test),
# so neither can prevent the edit. nerv installs
# `nervd --adapter aider lint|test` into them (argv in, exit code out).
# Output reaches the model only on a non-zero exit, as an error-repair
# prompt, so only block is expressible; warn/rewrite/context are dropped.
cli: aider

native: []

synthesized:
  - nerv: FileChanged
    source: bridge
    pattern: lint-cmd invocation with the edited file as trailing argv
  - nerv: PostToolUse
    source: bridge
    pattern: test-cmd invocation after edits are applied

unsupported:
  - SessionStart
  - SessionEnd
  - PreToolUse
  - SubagentStart
  - SubagentStop
  - UserPromptSubmit
  - Notification
  - PermissionRequest
  - PermissionDenied
  - TaskCreated
  - TaskCompleted
  - Stop
  - StopFailure
  - TeammateIdle
  - InstructionsLoaded
  - ConfigChange
  - CwdChanged
  - WorktreeCreate
  - WorktreeRemove
  - PreCompact
  - PostCompact
  - Elicitation
  - ElicitationResult
  - BeforeToolSelection
